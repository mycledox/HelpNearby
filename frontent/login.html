<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - HelpNearby</title>

    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>

<body class="login-page">

    <main class="auth-section login-auth">

        <section class="login-visual" aria-label="HelpNearby safety message">
            <a class="login-brand" href="index.html">
                <span class="login-brand-mark">+</span>
                <span>Help<span>Nearby</span></span>
            </a>
            <div class="login-visual-copy">
                <h2>Your Safety<br><strong>Our Priority</strong></h2>
                <p>Log in to connect with a part<br>of the help network.</p>
            </div>
            <div class="safety-art" aria-hidden="true">
                <div class="safety-hand safety-hand-left"></div>
                <div class="safety-hand safety-hand-right"></div>
                <div class="safety-heart">+</div>
            </div>
        </section>

        <section class="auth-container login-container">

            <h1>Welcome Back!</h1>

            <p>
                Login to your account
            </p>


            <form>

                <div class="form-group">

                    <label for="email">
                        Email or Phone
                    </label>

                    <input
                        type="text"
                        id="identifier"
                        placeholder="Enter your email or phone"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <a class="forgot-password" href="#">Forgot password?</a>

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <p>
                Don't have an account? <a href="register.html">Register</a>
            </p>

        </section>

    </main>

</body>
</html>
