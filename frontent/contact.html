<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - HelpNearby</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            HelpNearby
        </div>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="find-help.html">Find Help</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <main class="contact-section">

        <div class="page-heading">

            <h1>Contact Us</h1>

            <p>
                Contact the HelpNearby team.
            </p>

        </div>


        <form class="contact-form">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    rows="6"
                    placeholder="Write your message"
                    required
                ></textarea>

            </div>


            <button type="submit">
                Send Message
            </button>

        </form>

    </main>


    <footer class="footer">

        <p>
            (c) 2026 HelpNearby. All Rights Reserved.
        </p>

    </footer>

</body>
</html>
